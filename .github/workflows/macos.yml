# Builds the macOS plugin (Apple Silicon) on GitHub's Mac runners and uploads
# OneEighty.plugin as a build artifact.
#
# The After Effects SDK can't live in this public repo (Adobe licence), so it
# is checked out from a private repo: set the repository secret AE_SDK_TOKEN
# (a fine-grained token with read access to that repo's contents) and, if the
# repo isn't thinkvp/OneEighty-sdk, the repository variable AE_SDK_REPO. The
# private repo holds the SDK as ae/Examples/... (the same layout as sdk/ here).
name: macOS build

on:
  push:
    branches: [main, "mac**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Check SDK access
        env:
          AE_SDK_TOKEN: ${{ secrets.AE_SDK_TOKEN }}
        run: |
          if [ -z "$AE_SDK_TOKEN" ]; then
            echo "::error::Repository secret AE_SDK_TOKEN is not set (see the comment at the top of .github/workflows/macos.yml)"
            exit 1
          fi

      - name: Check out After Effects SDK (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AE_SDK_REPO || 'thinkvp/OneEighty-sdk' }}
          token: ${{ secrets.AE_SDK_TOKEN }}
          path: sdk

      # vcpkg's binary cache: OpenCV builds once, then restores in seconds.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-macos-arm64-2026.10.16-${{ hashFiles('deps/triplets/**') }}

      # ncnn (built from source, ~20 min), MoltenVK and the RIFE model. Restore
      # and save are split so the cache is saved even if a later step fails.
      - name: Restore ncnn, MoltenVK, RIFE model
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/ncnn-src
            deps/ncnn-mac
            deps/moltenvk
            deps/rife
          key: deps-macos-arm64-${{ hashFiles('deps/setup_deps_mac.sh') }}

      - name: Dependencies (OpenCV, ncnn, MoltenVK, RIFE model)
        run: sh deps/setup_deps_mac.sh

      - name: Save ncnn, MoltenVK, RIFE model
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/ncnn-src
            deps/ncnn-mac
            deps/moltenvk
            deps/rife
          key: deps-macos-arm64-${{ hashFiles('deps/setup_deps_mac.sh') }}

      - name: Build
        run: |
          cmake -S plugin -B plugin/build-mac -DCMAKE_BUILD_TYPE=Release
          cmake --build plugin/build-mac --parallel "$(sysctl -n hw.ncpu)"

      - name: Check the bundle
        run: |
          B=plugin/build-mac/OneEighty.plugin
          ls -R "$B"
          file "$B/Contents/MacOS/OneEighty"
          echo "Exported symbols:"
          nm -gU "$B/Contents/MacOS/OneEighty" | grep -E "EffectMain|PluginDataEntryFunction2"
          test -s "$B/Contents/Resources/OneEighty.rsrc"
          codesign --verify --verbose "$B"
          echo "Linked libraries (system only expected):"
          otool -L "$B/Contents/MacOS/OneEighty"
          test -s "$B/Contents/Frameworks/libMoltenVK.dylib"
          test -s "$B/Contents/Resources/rife-v4.6/flownet.bin"

      - name: Update check test
        run: plugin/build-mac/oe_update_test

      # CPU and Metal paths against ground truth (synthetic clips, ~2 min)
      - name: Validation tools
        run: |
          brew install ffmpeg
          python3 -m venv .venv
          .venv/bin/pip install --quiet opencv-python-headless numpy

      - name: Validate CPU and Metal
        working-directory: prototype
        run: |
          ../.venv/bin/python make_test_clip.py 5994p 50p gt
          ../.venv/bin/python validate_ci.py

      # On failure: re-run Quality High (RIFE) under lldb for a backtrace (the
      # input left behind by validate_ci.py is the 59.94p clip, or 50p)
      - name: Quality High backtrace (on failure)
        if: failure()
        working-directory: prototype
        env:
          OE_QUALITY: high
          MVK_CONFIG_LOG_LEVEL: "3"
        run: |
          test -f _ci_src.bgra || exit 0
          lldb --batch -o run -k "thread backtrace all" -k "image list -b" -k quit -- \
            ../plugin/build-mac/oe_gpu_offline _ci_src.bgra 1280 720 59.94005994 25 _ci_out.bgra 2>&1 \
            | grep -v "^	VK_" | head -400

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent plugin/build-mac/OneEighty.plugin dist/OneEighty-mac-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OneEighty-mac-arm64
          path: |
            dist/OneEighty-mac-arm64.zip
            plugin/build-mac/oe_offline
